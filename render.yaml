services:
  - type: web
    name: ats-resume-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /v1/health
    envVars:
      # NEVER commit real keys. Render will prompt for this value in the dashboard.
      - key: API_KEYS
        sync: false
      - key: RATE_LIMIT_PER_MINUTE
        value: "20"
      - key: MAX_UPLOAD_MB
        value: "20"
